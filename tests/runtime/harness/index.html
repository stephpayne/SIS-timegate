<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SCORM Observability Local LMS Harness</title>
    <style>
      body { font: 16px/1.4 system-ui, sans-serif; margin: 2rem; }
      button { margin: 0 .5rem .5rem 0; padding: .6rem .9rem; }
      iframe { border: 1px solid #bbb; display: block; height: 18rem; margin: 1rem 0; max-width: 100%; width: 100%; }
      pre { background: #f5f5f5; max-height: 30rem; overflow: auto; padding: 1rem; }
      @media (max-width: 600px) {
        body { margin: 1rem; }
        iframe { height: 32rem; }
      }
    </style>
    <script src="lms-harness.js"></script>
    <script src="../../../src/observability/host.js"></script>
  </head>
  <body>
    <h1>SCORM Observability Local LMS Harness</h1>
    <p>Use these controls to exercise a SCORM 1.2 session and inspect cumulative snapshots.</p>
    <button id="initialize" onclick="localLmsHarness.initialize()">Initialize</button>
    <button id="read-learner" onclick="localLmsHarness.readLearner()">Read learner ID</button>
    <button id="progress-50" onclick="localLmsHarness.progress(50)">50% progress</button>
    <button id="progress-100" onclick="localLmsHarness.progress(100)">100% progress</button>
    <button id="quiz-failure" onclick="localLmsHarness.quizFailure()">Quiz failure</button>
    <button id="quiz-retry" onclick="localLmsHarness.quizRetry()">Quiz retry/pass</button>
    <button id="complete" onclick="localLmsHarness.complete()">Write completion</button>
    <button id="commit" onclick="localLmsHarness.commit()">Commit</button>
    <button id="finish" onclick="localLmsHarness.finish()">Finish</button>
    <button id="toggle-commit-failure" onclick="localLmsHarness.failure.commit = !localLmsHarness.failure.commit">
      Toggle commit failure
    </button>
    <iframe
      id="content-frame"
      name="scormdriver_content"
      title="Instrumented course content"
      src="content.html"
    ></iframe>
    <h2>Timeline</h2>
    <pre id="timeline"></pre>
    <script>localLmsHarness.render()</script>
  </body>
</html>
